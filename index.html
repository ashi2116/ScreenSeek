<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ScreenSeek</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>

  <!-- SCROLLING POSTER WALL BACKGROUND -->
  <div class="poster-wall" id="posterWall">
    <div class="poster-col" id="col1"></div>
    <div class="poster-col" id="col2"></div>
    <div class="poster-col" id="col3"></div>
    <div class="poster-col" id="col4"></div>
    <div class="poster-col" id="col5"></div>
    <div class="poster-col" id="col6"></div>
    <div class="poster-col" id="col7"></div>
  </div>
  <div class="wall-overlay"></div>

  <!-- THEME TOGGLE -->
  <button class="theme-toggle" onclick="toggleTheme()">🌙</button>

  <!-- HERO SECTION -->
  <section class="hero">
    <div class="hero-content">
      <div class="logo-wrap">
        <span class="logo-icon">🎬</span>
        <h1 class="hero-title">
          <span class="t-screen">Screen</span><span class="t-seek">Seek</span>
        </h1>
      </div>
      <p class="hero-sub">Millions of movies. Find yours instantly.</p>

      <!-- SEARCH BAR + SUGGESTIONS -->
      <div class="search-wrap">
        <div class="search-box" id="searchBox">
          <span class="s-icon">🔍</span>
          <input
            type="text"
            id="searchInput"
            placeholder="Search movies, series, episodes..."
            autocomplete="off"
          />
          <button onclick="searchMovie()">Search</button>
        </div>
        <!-- Suggestions Dropdown -->
        <div class="suggestions" id="suggestions"></div>
      </div>

      <!-- FILTER BUTTONS -->
      <div class="filter-bar">
        <button class="filter-btn active" onclick="setFilter('movie',this)">🎬 Movies</button>
        <button class="filter-btn" onclick="setFilter('series',this)">📺 Series</button>
        <button class="filter-btn" onclick="setFilter('episode',this)">🎞️ Episodes</button>
        <button class="filter-btn" onclick="setFilter('',this)">🌐 All</button>
      </div>
    </div>
  </section>

  <!-- ERROR -->
  <div id="error-msg" class="error-msg"></div>

  <!-- POPULAR MOVIES (shown on homepage) -->
  <section class="popular-section" id="popularSection">
    <div class="section-header">
      <h2 class="section-title">🔥 Trending Now</h2>
    </div>
    <div class="results-grid" id="popularGrid"></div>
  </section>

  <!-- SEARCH RESULTS -->
  <section class="results-section hidden" id="resultsSection">
    <div class="section-header">
      <h2 class="section-title" id="resultsHeading"></h2>
    </div>
    <div class="results-grid" id="results"></div>
    <div class="pagination hidden" id="pagination">
      <button onclick="changePage(-1)" id="prevBtn">← Prev</button>
      <span id="pageInfo"></span>
      <button onclick="changePage(1)" id="nextBtn">Next →</button>
    </div>
  </section>

  <!-- FAVOURITES SECTION -->
  <section class="results-section hidden" id="favouritesSection">
    <div class="section-header">
      <h2 class="section-title">❤️ My Favourites</h2>
    </div>
    <div class="results-grid" id="favouritesGrid"></div>
  </section>

  <!-- FAB -->
  <button class="fab" onclick="toggleFavourites()" title="My Favourites">❤️</button>

  <!-- MODAL -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-content">
        <div class="modal-left">
          <img id="modal-poster" src="" alt="Poster"/>
          <button class="fav-btn" id="modal-fav-btn" onclick="toggleFavourite()">❤️ Add to Favourites</button>
        </div>
        <div class="modal-right">
          <h2 id="modal-title"></h2>
          <div class="modal-meta">
            <span id="modal-year" class="badge"></span>
            <span id="modal-rated" class="badge"></span>
            <span id="modal-runtime" class="badge"></span>
          </div>
          <div id="modal-imdb"></div>
          <p class="modal-label">Genre</p>
          <p id="modal-genre"></p>
          <p class="modal-label">Director</p>
          <p id="modal-director"></p>
          <p class="modal-label">Cast</p>
          <p id="modal-cast"></p>
          <p class="modal-label">Plot</p>
          <p id="modal-plot"></p>
          <div id="modal-trailer"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
